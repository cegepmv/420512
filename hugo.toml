baseURL = 'https://cegepmv.github.io/420512'
languageCode = 'fr-ca'
title = "Développement d'applications mobiles"
theme = 'relearn'
enableEmoji = true

[params]
  themeVariant = [ "learn", "relearn-dark", "relearn-light", "neon" ]
  disableLandingPageButton = true
  alwaysopen = false
  # Set this to true to disable copy-to-clipboard button for inline code.
  disableInlineCopyToClipBoard = true
  # Désactiver search bar
  # disableSearch = true
  # Hide breadcrumbs in the header and only show the current page title
  disableBreadcrumb = false
  # If set to true, hide table of contents menu in the header of all pages
  disableToc = true
  # Hide Next and Previous page buttons normally displayed full height beside content
  disableNextPrev = true
  hideAuthorDate = true
  [params.imageEffects]
    border = false
    lazy = true
    lightbox = false
    shadow = false

  [[params.boxStyle]]
    identifier = "exo"         # <-- THIS IS YOUR CUSTOM IDENTIFIER
    title = "Exercice"      # Default title for this identifier
    icon = "dumbbell"               # Default FontAwesome icon
    color = "#3835e5e7"
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
[caches]
  [caches.images]
    dir = ':cacheDir/images'